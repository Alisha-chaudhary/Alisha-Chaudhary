name: Generate fire contribution grid

on:
  schedule:
    - cron: "0 */12 * * *"      # every 12 hours
  workflow_dispatch:             # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - ".github/workflows/fire-contribution.yml"
      - ".github/scripts/build_fire.py"

permissions:
  contents: write                # needed so the job can commit the SVG back to main

concurrency:
  group: fire
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build fire contribution SVG from the contribution graph
        run: python .github/scripts/build_fire.py

      - name: Commit if the SVG changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/fire-contribution.svg
          if git diff --cached --quiet; then
            echo "No change to commit"
          else
            git commit -m "chore(fire): update contribution fire grid"
            git push
          fi
