<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d"><title id="t">ssh-enum</title><desc id="d">ssh-enum. Re-investigates CVE-2016-6210, an OpenSSH username enumeration timing side-channel, on a default Ubuntu Server configuration. Timing measurements were tested with Welch&#x27;s t-test and Cohen&#x27;s d. No significant difference was found, documented as a reproducible negative result. Repository github.com/Alisha-chaudhary/ssh-enum.</desc><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#391521" stop-opacity="1"/><stop offset="1" stop-color="#0B0B0E" stop-opacity="1"/></linearGradient></defs><rect x="0.5" y="0.5" width="999" height="299" rx="10" fill="url(#pg)" stroke="#391521" stroke-width="1"/><rect x="0" y="0" width="1000" height="3" rx="1.5" fill="#A83B32" opacity=".9"/><text x="36" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#C58A63" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="3.5" opacity="1">FEATURED PROJECT 04</text><rect x="482" y="30" width="114" height="22" rx="11" fill="none" stroke="#C58A63" stroke-opacity=".7"/><text x="539.0" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0" opacity="1">Research study</text><text x="36" y="96" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="36" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" opacity="1">ssh-enum</text><text x="36" y="134" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="15" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" opacity="0.93">Re-investigates CVE-2016-6210, an OpenSSH username enumeration timing</text><text x="36" y="157" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="15" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" opacity="0.93">side-channel, on a default Ubuntu Server configuration. Timing</text><text x="36" y="180" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="15" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" opacity="0.93">measurements were tested with Welch&#x27;s t-test and Cohen&#x27;s d. No</text><text x="36" y="203" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="15" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" opacity="0.93">significant difference was found, documented as a reproducible</text><text x="36" y="226" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="15" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" opacity="0.93">negative result.</text><rect x="36" y="250" width="64" height="24" rx="5" fill="#0B0B0E" stroke="#4A1B2A" stroke-width="1"/><text x="48" y="265.74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" opacity="1">Python</text><rect x="106" y="250" width="70" height="24" rx="5" fill="#0B0B0E" stroke="#4A1B2A" stroke-width="1"/><text x="118" y="265.74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" opacity="1">OpenSSH</text><rect x="182" y="250" width="57" height="24" rx="5" fill="#0B0B0E" stroke="#4A1B2A" stroke-width="1"/><text x="194" y="265.74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 