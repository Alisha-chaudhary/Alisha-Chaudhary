<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="1000" height="310" role="img" aria-labelledby="t d"><title id="t">Technical toolkit</title><desc id="d">Languages. Python, SQL, Bash. Frameworks and standards. MITRE ATT&amp;CK, NIST CSF, OWASP Top 10, CIS Controls. Vulnerability and intelligence. CVE analysis, CVSS v3.1, NVD API, Shodan, VirusTotal, AbuseIPDB, urlscan.io. Detection and telemetry. Sysmon, Splunk, SPL, Windows event logs. Security tools. Nmap, Wireshark, Burp Suite, Hydra, Metasploit, Kali Linux. Engineering. FastAPI, SQLAlchemy, SQLite, Pytest, Git, Linux, Windows. Working knowledge. Tenable Nessus, Qualys VMDR, Microsoft Defender VM.</desc><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#391521" stop-opacity="1"/><stop offset="1" stop-color="#0B0B0E" stop-opacity="1"/></linearGradient></defs><rect x=".5" y=".5" width="999" height="309" rx="12" fill="url(#pg)" stroke="#391521"/><text x="32" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#C58A63" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="1" opacity="1">Languages</text><rect x="290" y="22" width="67" height="26" rx="5" fill="#0B0B0E" stroke="#4A1B2A" stroke-width="1"/><text x="302" y="39.08" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" opacity="1">Python</text><rect x="365" y="22" width="46" height="26" rx="5" fill="#0B0B0E" stroke="#4A1B2A" stroke-width="1"/><text x="377" y="39.08" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" opacity="1">SQL</text><rect x="419" y="22" width="53" height="26" rx="5" fill="#0B0B0E" stroke="#4A1B2A" stroke