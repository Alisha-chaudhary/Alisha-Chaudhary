<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d"><title id="t">PhishMind</title><desc id="d">PhishMind. Phishing and business email compromise investigation platform. It parses .eml files, checks SPF, DKIM and DMARC, extracts indicators and uses cooperating agents to produce a structured verdict with confidence and MITRE ATT&amp;CK mapping. It recommends response actions and never applies them. Validated on synthetic samples. Repository github.com/Alisha-chaudhary/PhishMind.</desc><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#391521" stop-opacity=".62"/><stop offset="1" stop-color="#0B0B0E" stop-opacity="1"/></linearGradient></defs><rect x="0.5" y="0.5" width="999" height="299" rx="10" fill="url(#pg)" stroke="#391521" stroke-width="1"/><rect x="0" y="0" width="1000" height="3" rx="1.5" fill="#A83B32" opacity=".9"/><text x="36" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#C58A63" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="3.5" opacity="1">FEATURED PROJECT 03</text><rect x="548" y="30" width="48" height="22" rx="11" fill="none" stroke="#C58A63" stroke-opacity=".7"/><text x="572.0" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0" opacity="1">v1.0</text><text x="36" y="96" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="36" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" opacity="1">PhishMind</text><text x="36" y="134" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="15" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" opacity="0.93">Phishing and business 