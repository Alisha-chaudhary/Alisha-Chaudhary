<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d"><title id="t">IdentityGuard</title><desc id="d">IdentityGuard. Local IAM and access-governance lab covering role-based access control, joiner-mover-leaver workflows, access requests and approvals, segregation-of-duties checks and access review cycles. Privileged access is simulated with just-in-time grants, and actions are recorded in a tamper-evident audit chain. Repository github.com/Alisha-chaudhary/IdentityGuard.</desc><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#391521" stop-opacity=".62"/><stop offset="1" stop-color="#0B0B0E" stop-opacity="1"/></linearGradient></defs><rect x="0.5" y="0.5" width="999" height="299" rx="10" fill="url(#pg)" stroke="#391521" stroke-width="1"/><rect x="0" y="0" width="1000" height="3" rx="1.5" fill="#A83B32" opacity=".9"/><text x="36" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#C58A63" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="3.5" opacity="1">FEATURED PROJECT 02</text><rect x="435" y="30" width="161" height="22" rx="11" fill="none" stroke="#C58A63" stroke-opacity=".7"/><text x="515.5" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0" opacity="1">In active development</text><text x="36" y="96" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="36" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" opacity="1">IdentityGuard</text><text x="36" y="134" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="15" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" opacity="0.93">Local IAM 