<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-labelledby="t d"><title id="t">Engineering approach</title><desc id="d">Assess, validate, correlate, prioritise, document. Assess: Scope the system and its exposure. Validate: Test the claim and reproduce the result. Correlate: Link CVEs, indicators and telemetry. Prioritise: Rank by impact and by evidence. Document: Write findings others can act on.</desc><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#391521" stop-opacity=".62"/><stop offset="1" stop-color="#0B0B0E" stop-opacity="1"/></linearGradient></defs><rect x="0.5" y="0.5" width="999" height="199" rx="12" fill="url(#pg)" stroke="#391521"/><line x1="100" y1="62" x2="860" y2="62" stroke="#A83B32" stroke-width="1.6" stroke-dasharray="6 6"/><circle cx="100" cy="62" r="19" fill="#0B0B0E" stroke="#C58A63" stroke-width="1.5"/><circle cx="100" cy="62" r="6" fill="#A83B32"/><text x="100" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#C58A63" font-weight="bold" font-style="normal" text-anchor="middle" letter-spacing="2.5" opacity="1">ASSESS</text><text x="100" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0" opacity="0.88">Scope the system and</text><text x="100" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0" opacity="0.88">its exposure</text><path d="M191.0 56L199.0 62L191.0 68" fill="none" stroke="#C58A63" stroke-width="1.5"/><circle cx="290" cy="62" r="19" fill="#0B0B0E" stroke="#C58A63" stroke-width="1.5"/><circle cx="290" cy="62" r="6" fill="#A83B32"/><text x="290" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#C58A63" font-weight="bold" font-style="normal" text-anchor="middle" letter-spacing="2.5" opacity="1">VALIDATE</text><text x="290" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0" opacity="0.88">Test the claim and</text><text x="290" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0" opacity="0.88">reproduce the result</text><path d="M381.0 56L389.0 62L381.0 68" fill="none" stroke="#C58A63" stroke-width="1.5"/><circle cx="480" cy="62" r="19" fill="#0B0B0E" stroke="#C58A63" stroke-width="1.5"/><circle cx="480" cy="62" r="6" fill="#A83B32"/><text x="480" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#C58A63" font-weight="bold" font-style="normal" text-anchor="middle" letter-spacing="2.5" opacity="1">CORRELATE</text><text x="480" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0" opacity="0.88">Link CVEs, indicators</text><text x="480" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0" opacity="0.88">and telemetry</text><path d="M571.0 56L579.0 62L571.0 68" fill="none" stroke="#C58A63" stroke-width="1.5"/><circle cx="670" cy="62" r="19" fill="#0B0B0E" stroke="#C58A63" stroke-width="1.5"/><circle cx="670" cy="62" r="6" fill="#A83B32"/><text x="670" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#C58A63" font-weight="bold" font-style="normal" text-anchor="middle" letter-spacing="2.5" opacity="1">PRIORITISE</text><text x="670" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0" opacity="0.88">Rank by impact and by</text><text x="670" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0" opacity="0.88">evidence</text><path d="M761.0 56L769.0 62L761.0 68" fill="none" stroke="#C58A63" stroke-width="1.5"/><circle cx="860" cy="62" r="19" fill="#0B0B0E" stroke="#C58A63" stroke-width="1.5"/><circle cx="860" cy="62" r="9" fill="#C58A63"/><text x="860" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#C58A63" font-weight="bold" font-style="normal" text-anchor="middle" letter-spacing="2.5" opacity="1">DOCUMENT</text><text x="860" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0" opacity="0.88">Write findings others</text><text x="860" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#D9D2CB" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0" opacity="0.88">can act on</text></svg>